# ================================================================
#  hongguo-web · docker-compose.yml
#
#  适合个人/家用 NAS 一键部署：
#    docker compose up -d        启动
#    docker compose logs -f      看日志
#    docker compose down         停止并删除容器（保留卷）
#    docker compose down -v      停止并删除卷（清空设备 ID 与缓存）
#
#  卷说明：
#    hg-config       server/config/         含自动生成的 apikeys.json（设备 ID + 链路密钥）
#    hg-stream-cache server/stream-cache/   视频解密缓存（可删，删了下次播放会重新解密）
#    hg-download     download/              剧集下载目录
#
#  端口：
#    默认 8000:8000。要改外部端口，改左侧（如 8888:8000）即可。
#    内部端口由 Dockerfile ENV PORT=8000 决定，不要轻易动。
# ================================================================

services:
  hongguo-web:
    # 镜像名格式：ghcr.io/<GitHub用户名>/hongguo-web:<tag>
    # 默认拉 :latest，本地构建可改成 build: .
    image: ghcr.io/${GHCR_USER:-your-github-username}/hongguo-web:latest
    # 若没拉镜像而是本地构建，取消下行注释
    # build: .

    container_name: hongguo-web
    restart: unless-stopped

    # 端口映射：左侧宿主机端口，右侧容器端口（必须等于 PORT 环境变量）
    ports:
      - "${HG_PORT:-8000}:8000"

    # 环境变量：覆盖 server/config/config.json 默认值
    # 优先级：环境变量 > config.json > 代码内置默认
    environment:
      # 监听所有网卡（容器必须）
      BIND_HOST: 0.0.0.0
      # 内部端口，与 ports 右侧、Dockerfile EXPOSE 对齐
      PORT: 8000
      # 容器内无浏览器，关掉自动打开
      HG_OPEN_BROWSER: "false"
      # 下载目录指向卷
      HONGGUO_DOWNLOAD_DIR: /app/download
      # 时区
      TZ: Asia/Shanghai
      # ---- 以下为可选覆盖项，按需启用 ----
      # HONGGUO_HOST: api5-normal-sinfonlinea.fqnovel.com   # 上游 API 域名
      # HG_DEVICE_ID: ""                                    # 多实例隔离用
      # HG_TRANSCODE: "false"                               # HEVC 转 H.264
      # HONGGUO_DOWNLOAD_CONCURRENCY: "2"                   # 下载并发数

    # 命名卷：数据持久化，删容器不删数据
    volumes:
      - hg-config:/app/server/config
      - hg-stream-cache:/app/server/stream-cache
      - hg-download:/app/download

    # 健康检查由 Dockerfile 自带，这里只在容器失活时限制重启频率
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const r=http.get({host:'127.0.0.1',port:8000,path:'/',timeout:3000},x=>{process.exit(x.statusCode<500?0:1)}).on('error',()=>process.exit(1)).on('timeout',()=>{r.destroy();process.exit(1)});"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # 资源限制：解密较吃 CPU，但通常 1G 内存够用；按 NAS 实情调整
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 256M

    # 日志滚动：避免长跑堆积
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hg-config:
    name: hg-config
  hg-stream-cache:
    name: hg-stream-cache
  hg-download:
    name: hg-download
