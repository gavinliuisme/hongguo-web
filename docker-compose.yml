# ================================================================
#  hongguo-web · docker-compose.yml
#
#  适合个人/家用 NAS 一键部署：
#    docker compose up -d        启动
#    docker compose logs -f      看日志
#    docker compose down         停止并删除容器（保留卷）
#    docker compose down -v      停止并删除卷（清空设备 ID 与缓存）
#
#  卷说明（单卷设计）：
#    只挂载 /app/data/ 一个目录，承载所有运行时数据：
#
#      data/config/         配置文件 + 自动生成的 apikeys.json（设备 ID + 链路密钥）
#      data/stream-cache/   视频解密缓存（可删，删了下次播放会重新解密）
#      data/download/       剧集下载目录（每部剧一个子文件夹）
#
#    首次启动会自动从镜像内拷贝默认 config.json 到 data/config/，无需手动准备。
#    源码留在镜像内 /app/server/，不会被挂载覆盖。
#
#  端口：
#    默认 8000:8000。要改外部端口，改左侧（如 8888:8000）即可。
#    内部端口由 Dockerfile ENV PORT=8000 决定，不要轻易动。
# ================================================================

services:
  hongguo-web:
    # 镜像名格式：ghcr.io/<GitHub用户名>/hongguo-web:<tag>
    # 默认拉 :latest，本地构建可改成 build: .
    image: ghcr.io/${GHCR_USER:-your-github-username}/hongguo-web:latest
    # 若没拉镜像而是本地构建，取消下行注释
    # build: .

    container_name: hongguo-web
    restart: unless-stopped

    # 端口映射：左侧宿主机端口，右侧容器端口（必须等于 PORT 环境变量）
    ports:
      - "${HG_PORT:-8000}:8000"

    # 环境变量：覆盖 server/config/config.json 的默认值
    # 优先级：环境变量 > config.json > 代码内置默认
    # 数据路径已在 Dockerfile ENV 里默认指向 /app/data/，这里不必再设
    environment:
      # 监听所有网卡（容器必须）
      BIND_HOST: 0.0.0.0
      # 内部端口，与 ports 右侧、Dockerfile EXPOSE 对齐
      PORT: 8000
      # 容器内无浏览器，关掉自动打开
      HG_OPEN_BROWSER: "false"
      # 时区
      TZ: Asia/Shanghai
      # ---- 以下为可选覆盖项，按需启用 ----
      # HONGGUO_HOST: api5-normal-sinfonlinea.fqnovel.com   # 上游 API 域名
      # HG_DEVICE_ID: ""                                    # 多实例隔离用
      # HG_TRANSCODE: "false"                               # HEVC 转 H.264
      # HONGGUO_DOWNLOAD_CONCURRENCY: "2"                   # 下载并发数

    # 单卷挂载：宿主机一个目录覆盖容器内 /app/data/
    # config / stream-cache / download 三个子目录都在这里
    volumes:
      - hg-data:/app/data

    # 健康检查：HTTP 端口探活
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const r=http.get({host:'127.0.0.1',port:8000,path:'/',timeout:3000},x=>{process.exit(x.statusCode<500?0:1)}).on('error',()=>process.exit(1)).on('timeout',()=>{r.destroy();process.exit(1)});"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # 资源限制：解密较吃 CPU，但通常 1G 内存够用；按 NAS 实情调整
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 256M

    # 日志滚动：避免长跑堆积
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hg-data:
    name: hg-data
