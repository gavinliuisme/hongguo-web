# ================================================================
#  hongguo-web · docker-compose.yml
#
#  适合个人/家用 NAS 一键部署：
#    docker compose up -d        启动
#    docker compose logs -f      看日志
#    docker compose down         停止并删除容器（数据保留在宿主机目录里）
#
#  卷说明（三目录 bind mount，直接挂宿主机路径）：
#    宿主机路径                                   容器内路径                       说明
#    /volume2/hongguo-web/config           /app/data/config           配置 + apikeys.json（设备 ID + 密钥）
#    /volume2/hongguo-web/stream-cache     /app/data/stream-cache     视频解密缓存（可删，删了重新解密）
#    /volume2/hongguo-web/download         /app/data/download         剧集下载目录
#
#    首次启动 entrypoint 会自动：
#      1. 在三个挂载点建子目录（如果不存在）
#      2. 从镜像模板拷贝默认 config.json 到 config/（如果不存在）
#      3. 修属主为 node 用户（UID 1000）
#
#  端口：
#    默认 8000:8000。要改外部端口，改左侧（如 8888:8000）即可。
#    内部端口由 Dockerfile ENV PORT=8000 决定，不要轻易动。
# ================================================================

services:
  hongguo-web:
    # 镜像名格式：ghcr.io/<GitHub用户名>/hongguo-web:<tag>
    # 默认拉 :latest，本地构建可改成 build: .
    image: ghcr.io/${GHCR_USER:-your-github-username}/hongguo-web:latest
    # 若没拉镜像而是本地构建，取消下行注释
    # build: .

    container_name: hongguo-web
    restart: unless-stopped

    # 端口映射：左侧宿主机端口，右侧容器端口（必须等于 PORT 环境变量）
    ports:
      - "${HG_PORT:-8000}:8000"

    # 环境变量：覆盖 server/config/config.json 的默认值
    # 优先级：环境变量 > config.json > 代码内置默认
    # 数据路径已在 Dockerfile ENV 里默认指向 /app/data/，这里不必再设
    environment:
      # 监听所有网卡（容器必须）
      BIND_HOST: 0.0.0.0
      # 内部端口，与 ports 右侧、Dockerfile EXPOSE 对齐
      PORT: 8000
      # 容器内无浏览器，关掉自动打开
      HG_OPEN_BROWSER: "false"
      # 时区
      TZ: Asia/Shanghai
      # ---- 以下为可选覆盖项，按需启用 ----
      # HONGGUO_HOST: api5-normal-sinfonlinea.fqnovel.com   # 上游 API 域名
      # HG_DEVICE_ID: ""                                    # 多实例隔离用
      # HG_TRANSCODE: "false"                               # HEVC 转 H.264
      # HONGGUO_DOWNLOAD_CONCURRENCY: "2"                   # 下载并发数

    # 三目录 bind mount：直接挂宿主机具体路径
    # 宿主机目录不存在时 Docker 会自动创建（属 root，entrypoint 会 chown）
    # 改宿主机路径：把下面三行左侧的 /volume2/hongguo-web/ 改成你想要的目录
    volumes:
      - /volume2/hongguo-web/config:/app/data/config
      - /volume2/hongguo-web/stream-cache:/app/data/stream-cache
      - /volume2/hongguo-web/download:/app/data/download

    # 健康检查：HTTP 端口探活
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const r=http.get({host:'127.0.0.1',port:8000,path:'/',timeout:3000},x=>{process.exit(x.statusCode<500?0:1)}).on('error',()=>process.exit(1)).on('timeout',()=>{r.destroy();process.exit(1)});"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # 日志滚动：避免长跑堆积
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
