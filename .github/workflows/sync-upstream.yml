# ================================================================
#  hongguo-web · 上游同步与自动发布
#
#  触发：
#    1. schedule（cron）         —— 每 6 小时检查一次上游
#    2. workflow_dispatch        —— 手动触发，可选 force 强制 sync（即使版本未变）
#
#  逻辑：
#    1. fetch 上游 sunnysky123/hongguo-web 的 main 分支
#    2. 对比上游 package.json 的 version 字段与当前 fork 的 version
#    3. 若版本号变化（或 force=true）：
#       a. git merge upstream/main 到 fork main（保留 Docker 文件，上游没动它们）
#       b. push 到 fork main
#       c. 创建并 push tag v<版本号>-docker（如 v1.1.9-docker）
#    4. tag push 会自动触发 docker.yml workflow 构建镜像并推 GHCR
#
#  冲突处理：
#    上游不会动 fork 的 Docker 相关文件（Dockerfile / docker-compose.yml /
#    .github/workflows/docker.yml / scripts/docker-entrypoint.sh），所以
#    merge 一般不会冲突。万一冲突，本 workflow 直接失败，留人工处理。
#
#  免责：
#    - cron 触发在 GitHub 调度繁忙时可能延迟十几分钟，正常
#    - 每天约 4 次 sync 尝试，几乎不消耗 CI 额度（version 没变时 30 秒退出）
# ================================================================

name: Sync upstream and tag

on:
  schedule:
    # 每 6 小时检查一次：UTC 00:00, 06:00, 12:00, 18:00（北京时间 08/14/20/02）
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制 sync 即使版本号未变（仍会创建新 tag）'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: 检查并同步上游
    runs-on: ubuntu-latest
    # 只在默认分支跑（避免在临时分支触发意外 sync）
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: 检出 fork（完整历史，便于 merge）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 git 身份
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 添加上游 remote
        run: |
          git remote add upstream https://github.com/sunnysky123/hongguo-web.git
          # 只 fetch main 分支，不拉 --tags：
          # 上游的 tag 命名（v1.1.8 等）可能与 fork 已有 tag 冲突（fork 用 v1.1.8-docker），
          # fetch --tags 遇到同名 tag 会拒绝并退出码 1。
          # sync 只需要 package.json 的 version 字段，不需要上游 tag。
          git fetch upstream main --no-tags

      - name: 对比版本号与上游 commit
        id: check
        run: |
          set -uo pipefail

          # 提取版本号（与 pack.sh / release.yml 完全相同的 sed 表达式，避免漂移）
          extract_version() {
            sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$1" | head -1
          }

          # 当前 fork 的版本号
          CURRENT="$(extract_version package.json)"

          # 上游 main 的版本号
          UPSTREAM="$(git show upstream/main:package.json | extract_version /dev/stdin)"

          echo "当前 fork 版本：${CURRENT:-<未设置>}"
          echo "上游   版本：${UPSTREAM:-<未设置>}"

          if [ -z "$UPSTREAM" ]; then
            echo "::error::上游 package.json 没有 version 字段，无法判断"
            exit 1
          fi

          echo "current_version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$UPSTREAM" >> "$GITHUB_OUTPUT"

          # ---- 检查上游是否有 fork 还没合并的 commit ----
          # git rev-list A..B 列出 B 有但 A 没有的 commit。
          # 这里列 upstream/main 有但 origin/main 没有的 commit。
          # 注意：origin/main 此时是 actions/checkout 时的快照，可能落后于远程最新，
          #       但用于判断"上游是否有 fork 没有的 commit"已经够用 ——
          #       若 upstream/main..origin/main 为空说明 fork 在 CI 启动那一刻已含上游全部 commit。
          # 取 origin/main 的 HEAD SHA（actions/checkout 已 fetch 完整历史）
          FORK_HEAD="$(git rev-parse origin/main)"
          UPSTREAM_HEAD="$(git rev-parse upstream/main)"
          echo "fork HEAD     : $FORK_HEAD"
          echo "upstream HEAD : $UPSTREAM_HEAD"

          # upstream/main 有但 origin/main 没有的 commit 数
          BEHIND_COUNT="$(git rev-list --count "origin/main..upstream/main" 2>/dev/null || echo 0)"
          echo "上游领先 fork 的 commit 数：$BEHIND_COUNT"

          # 同时检查 fork main 的 commit 是否已包含 upstream HEAD
          # （如果 fork main 已经包含 upstream HEAD，说明 fork 至少跟上游齐平）
          if [ "$BEHIND_COUNT" = "0" ]; then
            HAS_UPSTREAM_COMMITS="false"
          else
            HAS_UPSTREAM_COMMITS="true"
          fi
          echo "上游有 fork 未合并的 commit：$HAS_UPSTREAM_COMMITS"
          echo "has_upstream_commits=$HAS_UPSTREAM_COMMITS" >> "$GITHUB_OUTPUT"

          FORCE="${{ inputs.force || false }}"
          if [ "$FORCE" = "true" ]; then
            echo "force=true，强制 sync"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "reason=force" >> "$GITHUB_OUTPUT"
          elif [ "$CURRENT" != "$UPSTREAM" ]; then
            echo "版本号变化：${CURRENT:-<无>} -> $UPSTREAM，将 sync"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "reason=version_changed" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_UPSTREAM_COMMITS" = "true" ]; then
            # 版本号未变，但上游有 fork 没有的 commit（如 bug 修复、文档更新）
            echo "版本号未变，但上游有 $BEHIND_COUNT 个新 commit，将 sync"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "reason=upstream_commits" >> "$GITHUB_OUTPUT"
          else
            echo "版本号未变化（$CURRENT）且上游无新 commit，跳过"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "reason=no_change" >> "$GITHUB_OUTPUT"
          fi

      - name: 检查 tag 是否已存在
        if: steps.check.outputs.changed == 'true'
        id: tagcheck
        run: |
          set -uo pipefail
          BASE_TAG="v${{ steps.check.outputs.upstream_version }}-docker"
          REASON="${{ steps.check.outputs.reason }}"

          # 不同触发场景用不同的 tag 命名策略：
          # - reason=version_changed（版本号变了）：
          #     用基础 tag，如 v1.2.3-docker。已存在则跳过（说明上次 sync 已完成）
          # - reason=upstream_commits（版本号没变但上游有新 commit）：
          #     用带时间戳后缀的 tag，如 v1.2.2-docker.20261102-1421
          #     这样同一版本号可以发多次镜像，记录每次 sync 的时间
          # - reason=force（手动强制）：
          #     同样用时间戳后缀，避免覆盖已有 tag
          if [ "$REASON" = "version_changed" ]; then
            TAG="$BASE_TAG"
            if git tag -l "$TAG" | grep -q .; then
              echo "tag $TAG 已存在，跳过 sync（版本号升级场景，上次 sync 已完成）"
              echo "exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "tag $TAG 不存在，将创建"
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # upstream_commits 或 force 场景：用北京时间时间戳后缀
            # 用 Asia/Shanghai 时区（UTC+8），比 UTC 更直观
            # 格式：v1.2.2-docker.20261103-0944 (YYYYMMDD-HHMM 北京时间)
            TS="$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)"
            TAG="${BASE_TAG}.${TS}"
            # 极小概率同一分钟内重复触发，加 SHA 短哈希进一步去重
            if git tag -l "$TAG" | grep -q .; then
              SHA7="$(git rev-parse --short=7 upstream/main)"
              TAG="${BASE_TAG}.${TS}.${SHA7}"
            fi
            echo "使用北京时间时间戳后缀的 tag：$TAG"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "base_tag=$BASE_TAG" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: 抓取上游 release notes
        # 用 GitHub API 拿上游对应 tag 的 release body，
        # 作为 fork release 的说明一部分，让用户看到上游改了啥。
        # 拿不到（如上游没发 release，只是改了 version）则用占位文本。
        if: steps.check.outputs.changed == 'true' && steps.tagcheck.outputs.exists == 'false'
        id: upstream_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          UPSTREAM_TAG="v${{ steps.check.outputs.upstream_version }}"
          echo "尝试获取上游 release: $UPSTREAM_TAG"

          # 用 gh api 拿上游 release body
          # --jq 直接提取 body 字段，失败返回空
          BODY="$(gh api "repos/sunnysky123/hongguo-web/releases/tags/$UPSTREAM_TAG" --jq '.body' 2>/dev/null || true)"

          if [ -z "$BODY" ] || [ "$BODY" = "null" ]; then
            echo "上游 $UPSTREAM_TAG 没有 release 或 body 为空，用占位文本"
            BODY="（上游 $UPSTREAM_TAG 未发布 release，或 release 无说明）"
          else
            echo "✅ 已获取上游 release notes（${#BODY} 字符）"
          fi

          # 写到文件，避免 GITHUB_OUTPUT 多行字符串难处理
          echo "$BODY" > /tmp/upstream_release_notes.md
          echo "notes_file=/tmp/upstream_release_notes.md" >> "$GITHUB_OUTPUT"
          echo ""
          echo "--- 上游 release notes 预览 ---"
          head -20 /tmp/upstream_release_notes.md

      - name: Merge 上游 main 到 fork main
        if: steps.check.outputs.changed == 'true' && steps.tagcheck.outputs.exists == 'false'
        run: |
          set -euo pipefail

          # 关键：先把 origin/main 拉下来 rebase，否则 push 会被拒（non-fast-forward）
          # 原因：actions/checkout 拿的是 CI 启动那一刻的 main 快照，
          #       CI 启动后若 fork main 又有新 commit（如刚改了 workflow 文件），
          #       本地 main 就落后于远程，merge 完 push 会被拒。
          git fetch origin main --no-tags
          git rebase origin/main

          # merge 上游 main 到当前 main。
          # --no-edit：用默认 commit message
          # 不用 --ff-only：上游有新提交时 main 已经在分叉状态，必须 merge commit
          # 上游不会动 Docker 相关文件，所以不会冲突
          if ! git merge upstream/main --no-edit; then
            echo "::error::merge 失败，可能有冲突"
            echo ""
            echo "冲突文件："
            git diff --name-only --diff-filter=U
            echo ""
            echo "请手动到 fork 仓库解决冲突："
            echo "  git fetch upstream"
            echo "  git merge upstream/main"
            echo "  # 解决冲突后"
            echo "  git push origin main"
            exit 1
          fi

      - name: Push 到 fork main
        if: steps.check.outputs.changed == 'true' && steps.tagcheck.outputs.exists == 'false'
        run: |
          # 用 --force-with-lease 兜底：理论上 rebase 后是 fast-forward，
          # 但若 CI 期间 origin/main 又有新 push（如另一个 sync 重跑），
          # 普通 push 会被拒。--force-with-lease 会在远程未变化时强推，
          # 远程有新变化时拒绝（避免覆盖别人的提交）。
          git push --force-with-lease origin main

      - name: 创建并 push tag（含验证）
        if: steps.check.outputs.changed == 'true' && steps.tagcheck.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tagcheck.outputs.tag }}"
          REPO="${{ github.repository }}"
          REASON="${{ steps.check.outputs.reason }}"
          UPSTREAM_TAG="v${{ steps.check.outputs.upstream_version }}"
          SHA="$(git rev-parse HEAD)"
          NOTES_FILE="/tmp/upstream_release_notes.md"
          echo "当前 HEAD: $SHA"
          echo "将创建 tag: $TAG"
          echo "触发原因: $REASON"

          # 读上游 release notes（前面步骤已写到文件）
          if [ ! -f "$NOTES_FILE" ]; then
            echo "（上游 release notes 文件不存在，用占位）" > "$NOTES_FILE"
          fi
          UPSTREAM_NOTES="$(cat "$NOTES_FILE")"

          # 根据 reason 生成不同的 release 说明
          # 公共头：所有 reason 都包含上游版本、镜像地址
          case "$REASON" in
            version_changed)
              TITLE="自动同步到 v${{ steps.check.outputs.upstream_version }}"
              HEADER="自动同步自上游 sunnysky123/hongguo-web $UPSTREAM_TAG

          - 上游版本：$UPSTREAM_TAG
          - 触发原因：版本号变化
          - 镜像地址：
            - \`ghcr.io/${{ github.repository_owner }}/hongguo-web:${{ steps.check.outputs.upstream_version }}-docker\`
            - \`ghcr.io/${{ github.repository_owner }}/hongguo-web:latest\`
          "
              ;;
            upstream_commits)
              TITLE="自动同步到 v${{ steps.check.outputs.upstream_version }} (代码更新)"
              HEADER="版本号未变（仍为 ${{ steps.check.outputs.upstream_version }}），但上游有新 commit

          - 上游版本：$UPSTREAM_TAG（未变）
          - 触发原因：上游有 fork 未合并的 commit
          - tag 带时间戳后缀：$TAG
          - 镜像地址：
            - \`ghcr.io/${{ github.repository_owner }}/hongguo-web:${{ steps.tagcheck.outputs.tag }}\`
            - \`ghcr.io/${{ github.repository_owner }}/hongguo-web:latest\`
          "
              ;;
            force)
              TITLE="手动强制同步 v${{ steps.check.outputs.upstream_version }}"
              HEADER="手动触发 sync-upstream workflow 并勾选 force=true

          - 上游版本：$UPSTREAM_TAG
          - 触发原因：手动强制
          - tag 带时间戳后缀：$TAG
          - 镜像地址：
            - \`ghcr.io/${{ github.repository_owner }}/hongguo-web:${{ steps.tagcheck.outputs.tag }}\`
            - \`ghcr.io/${{ github.repository_owner }}/hongguo-web:latest\`
          "
              ;;
            *)
              TITLE="自动同步 v${{ steps.check.outputs.upstream_version }}"
              HEADER="触发原因：$REASON

          - 上游版本：$UPSTREAM_TAG
          - 镜像地址：
            - \`ghcr.io/${{ github.repository_owner }}/hongguo-web:${{ steps.tagcheck.outputs.tag }}\`
            - \`ghcr.io/${{ github.repository_owner }}/hongguo-web:latest\`
          "
              ;;
          esac

          # 组装最终 notes：header + 分隔线 + 上游 release notes + 尾部说明
          # 写到文件，避免 shell 转义复杂字符串（反引号、$ 等）出问题
          # 注意：上游 notes 和 HEADER 里都可能含反引号（markdown 代码块），
          #       不能用 heredoc 或 echo "$VAR"，要用 printf '%s' 避免转义
          OUT="/tmp/fork_release_notes.md"
          {
            printf '%s\n\n' "$HEADER"
            echo "---"
            echo ""
            echo "## 上游 $UPSTREAM_TAG 发布说明"
            echo ""
            cat "$NOTES_FILE"
            echo ""
            echo "---"
            echo ""
            echo "由 sync-upstream workflow 自动生成。"
          } > "$OUT"

          echo "--- fork release notes 预览 ---"
          cat "$OUT"
          echo "----------------------------------------"

          # 用 gh CLI 创建 release（同时创建 tag）
          # 不用 --generate-notes 了，我们自己组装的 notes 已经包含上游 changelog
          gh release create "$TAG" \
            --repo "$REPO" \
            --target main \
            --title "$TITLE" \
            --notes-file "$OUT"

          echo "✅ 已创建 release 和 tag: $TAG"
          echo ""

          # 验证 tag 真的存在
          echo "--- 验证 tag ---"
          if gh api "repos/$REPO/git/refs/tags/$TAG" >/dev/null 2>&1; then
            echo "✅ tag $TAG 已存在于 GitHub"
          else
            echo "::error::tag $TAG 创建后验证失败"
            exit 1
          fi

          echo ""
          echo "tag push 会自动触发 docker.yml workflow 构建并推送镜像"
          echo "（若 GITHUB_TOKEN 触发的 tag push 未自动触发 docker.yml，下一步会兜底）"

      - name: 兜底触发 docker workflow
        # GitHub 设计：用 GITHUB_TOKEN 推的 tag 不会触发其他 workflow（防递归）
        # 所以这里用 gh workflow run 主动触发 docker.yml，确保构建一定发生
        if: steps.check.outputs.changed == 'true' && steps.tagcheck.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="${{ steps.tagcheck.outputs.tag }}"

          # 等 5 秒让 release/tag 完全落地
          sleep 5

          # 用 workflow_dispatch 直接触发 docker.yml
          # ref 用刚创建的 tag，docker.yml 会识别为 tag 触发，自动推 :latest + :版本号
          echo "主动触发 docker.yml workflow（ref=$TAG）..."
          gh workflow run docker.yml \
            --repo "$REPO" \
            --ref "$TAG"

          echo "✅ 已触发 docker.yml"
          echo "查看进度：https://github.com/$REPO/actions/workflows/docker.yml"

      - name: 等待 docker workflow 触发
        if: steps.check.outputs.changed == 'true' && steps.tagcheck.outputs.exists == 'false'
        run: |
          echo "查看构建进度："
          echo "  https://github.com/${{ github.repository }}/actions/workflows/docker.yml"
          echo ""
          echo "约 5-10 分钟后镜像会推到："
          echo "  ghcr.io/${{ github.repository_owner }}/hongguo-web:${{ steps.tagcheck.outputs.tag }}"
          echo "  ghcr.io/${{ github.repository_owner }}/hongguo-web:latest"

      - name: 摘要
        if: always()
        run: |
          REASON="${{ steps.check.outputs.reason }}"
          if [ "$REASON" = "no_change" ] || [ -z "$REASON" ]; then
            echo "**未同步**：版本号未变（${{ steps.check.outputs.current_version }}）且上游无新 commit"
          elif [ "${{ steps.tagcheck.outputs.exists }}" = "true" ]; then
            echo "**未同步**：tag ${{ steps.tagcheck.outputs.tag }} 已存在"
          else
            case "$REASON" in
              force)
                echo "**手动强制 sync**：force=true"
                ;;
              version_changed)
                echo "**已同步**（版本号升级）：${{ steps.check.outputs.current_version }} -> ${{ steps.check.outputs.upstream_version }}"
                ;;
              upstream_commits)
                echo "**已同步**（版本号未变但上游有新 commit）"
                echo "  上游版本仍为：${{ steps.check.outputs.upstream_version }}"
                ;;
            esac
            echo "**已打 tag**：${{ steps.tagcheck.outputs.tag }}"
            echo "Docker 镜像构建已自动触发，等 5-10 分钟。"
          fi
